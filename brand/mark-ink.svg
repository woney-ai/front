  <!-- Ink, for light grounds.
       The chip's own contact layout draws the letter: the channels that
       separate its plates are the W, so the mark is the wiring rather than
       a shape laid over it.

       Vectorised from the rendered mark and recoloured to the brand token.
       An automatic trace carries small irregularities a hand-drawn path
       would not — invisible at the sizes this is used at, worth redrawing
       over if the mark is ever embossed or printed large. -->
