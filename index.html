<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Matches --ink in index.css. It was #0a0a0a, close enough to look
         right and wrong enough to show a seam on mobile browser chrome. -->
    <meta name="theme-color" content="#070a10" />

    <link rel="canonical" href="https://woney.ai/" />

    <title>Woney — give your AI agent a way to pay</title>
    <meta
      name="description"
      content="Your agent can shop. It can't pay. Woney gives it a real way to — one that works at any checkout, asks nothing of the merchant, and is never your card."
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Woney" />
    <meta property="og:url" content="https://woney.ai/" />
    <meta property="og:title" content="Woney — give your AI agent a way to pay" />
    <meta
      property="og:description"
      content="Your agent can shop. It can't pay. Woney gives it a real way to — one that works at any checkout and is never your card."
    />

    <!-- Absolute URL on purpose: scrapers do not resolve relative paths, and a
         summary_large_image card with no image renders as an empty box. -->
    <meta property="og:image" content="https://woney.ai/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Woney. Agents can shop. They can't pay."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Woney — give your AI agent a way to pay" />
    <meta
      name="twitter:description"
      content="Your agent can shop. It can't pay. Woney gives it a real way to — one that works at any checkout and is never your card."
    />
    <meta name="twitter:image" content="https://woney.ai/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
