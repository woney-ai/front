<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Matches --ink in index.css. It was #0a0a0a, close enough to look
         right and wrong enough to show a seam on mobile browser chrome. -->
    <meta name="theme-color" content="#070a10" />

    <link rel="canonical" href="https://woney.ai/" />

    <!-- Closed until the copy is final. robots.txt already disallows everyone,
         which stops well-behaved crawlers from fetching this page at all — but
         a disallowed URL can still be listed bare, from inbound links alone,
         and not every crawler that ignores robots.txt ignores this tag too.
         The two cover different gaps, so both stay until launch.

         Remove this together with the robots.txt allowlist, in one deliberate
         commit. See the note at the top of public/robots.txt. -->
    <meta name="robots" content="noindex, nofollow" />

    <title>Woney — agents can shop. They can't pay.</title>
    <meta
      name="description"
      content="Woney closes that gap. Your agent gets a real way to pay, that is never your card."
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Woney" />
    <meta property="og:url" content="https://woney.ai/" />
    <meta
      property="og:title"
      content="Woney — agents can shop. They can't pay."
    />
    <meta
      property="og:description"
      content="Woney closes that gap. Your agent gets a real way to pay, that is never your card."
    />

    <!-- Absolute URL on purpose: scrapers do not resolve relative paths, and a
         summary_large_image card with no image renders as an empty box. -->
    <meta property="og:image" content="https://woney.ai/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Woney. Agents can shop. They can't pay."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Woney — agents can shop. They can't pay."
    />
    <meta
      name="twitter:description"
      content="Woney closes that gap. Your agent gets a real way to pay, that is never your card."
    />
    <meta name="twitter:image" content="https://woney.ai/og.png" />

    <!-- The page renders on the client, so a crawler that does not run
         JavaScript sees an empty div. This block does not: it is static HTML,
         it is machine-readable, and it states plainly what the product is.
         For a company built so that agents can buy things, being legible to
         the systems those agents run on is not a nice-to-have.

         Keep this honest with the page. `featureList` describes what ships;
         anything on the roadmap belongs in the copy, not in structured data a
         machine will quote back as fact. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://woney.ai/#organization",
            "name": "Woney",
            "url": "https://woney.ai/",
            "logo": "https://woney.ai/og.png",
            "email": "hello@woney.ai",
            "description": "Payments infrastructure that lets an AI agent pay for a purchase without ever holding its owner's card."
          },
          {
            "@type": "WebSite",
            "@id": "https://woney.ai/#website",
            "url": "https://woney.ai/",
            "name": "Woney",
            "publisher": { "@id": "https://woney.ai/#organization" },
            "inLanguage": "en"
          },
          {
            "@type": "SoftwareApplication",
            "name": "Woney",
            "applicationCategory": "FinanceApplication",
            "operatingSystem": "Web",
            "url": "https://woney.ai/",
            "publisher": { "@id": "https://woney.ai/#organization" },
            "description": "Woney issues a virtual card for a single purchase so an AI agent can check out at any online merchant on its owner's behalf. The agent completes the merchant's normal checkout itself — nothing is required of the merchant — and never receives the owner's real card. Spending is bounded by a limit the owner sets in advance.",
            "featureList": [
              "A virtual card issued per purchase, valid for one transaction",
              "Card amount capped at issuance",
              "Works at any online checkout with no merchant integration",
              "Per-agent spending limits set by the account owner",
              "The owner's real card is never exposed to the agent"
            ],
            "audience": {
              "@type": "Audience",
              "audienceType": "AI agent developers and people who delegate purchases to AI assistants"
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <!-- The page is prerendered, so without JavaScript a visitor now sees a
         complete landing page whose form quietly does nothing on submit — the
         markup is there, the handler is not. Before prerendering they saw an
         empty div and knew. Turning an obvious failure into a silent one is
         worse than either, so say it plainly instead. -->
    <noscript>
      <div
        style="
          position: fixed;
          inset: 0 0 auto 0;
          z-index: 100;
          background: #f3f0e8;
          color: #070a10;
          padding: 0.875rem 1.25rem;
          font:
            500 0.875rem/1.5 ui-monospace,
            monospace;
          text-align: center;
        "
      >
        This page needs JavaScript to take your email. Enable it, or write to
        <a href="mailto:hello@woney.ai" style="color: inherit"
          >hello@woney.ai</a
        >
        and we will add you by hand.
      </div>
    </noscript>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
