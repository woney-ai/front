<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Matches --ink in index.css. It was #0a0a0a, close enough to look
         right and wrong enough to show a seam on mobile browser chrome. -->
    <meta name="theme-color" content="#070a10" />

    <link rel="canonical" href="https://woney.ai/" />

    <title>Woney — give your AI agent a way to pay</title>
    <meta
      name="description"
      content="Your agent gets a real way to pay, that is never your card."
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Woney" />
    <meta property="og:url" content="https://woney.ai/" />
    <meta
      property="og:title"
      content="Woney — give your AI agent a way to pay"
    />
    <meta
      property="og:description"
      content="Your agent gets a real way to pay, that is never your card."
    />

    <!-- Absolute URL on purpose: scrapers do not resolve relative paths, and a
         summary_large_image card with no image renders as an empty box. -->
    <meta property="og:image" content="https://woney.ai/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <!-- Describes the image, not the product. The share image is the wordmark
         and nothing else, so an alt that recites a tagline the picture no
         longer contains would be describing a different image. -->
    <meta property="og:image:alt" content="The Woney wordmark." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Woney — give your AI agent a way to pay"
    />
    <meta
      name="twitter:description"
      content="Your agent gets a real way to pay, that is never your card."
    />
    <meta name="twitter:image" content="https://woney.ai/og.png" />

    <!-- The page renders on the client, so a crawler that does not run
         JavaScript sees an empty div. This block does not: it is static HTML,
         it is machine-readable, and it states plainly what the product is.
         For a company built so that agents can buy things, being legible to
         the systems those agents run on is not a nice-to-have.

         Two rules, and the second was learned by breaking it.

         Keep it honest. `featureList` describes what ships; anything on the
         roadmap belongs in the copy, not in structured data a machine will
         quote back as fact.

         Keep it in the page's words. This block spent a day out of step with
         the page: "issues", "merchant", "capped at issuance" — the exact
         vocabulary the visible copy had just shed — and it listed five
         features against the page's six. This is the one surface written for
         machines, so it is the last place that should speak a dialect the
         humans were spared. Every line below is the page's own sentence. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://woney.ai/#organization",
            "name": "Woney",
            "url": "https://woney.ai/",
            "logo": "https://woney.ai/logo.png",
            "email": "hello@woney.ai",
            "sameAs": ["https://www.linkedin.com/company/woney-ai/"],
            "description": "Payments infrastructure that gives an AI agent a way to pay that is never its owner's card."
          },
          {
            "@type": "WebSite",
            "@id": "https://woney.ai/#website",
            "url": "https://woney.ai/",
            "name": "Woney",
            "publisher": { "@id": "https://woney.ai/#organization" },
            "inLanguage": "en"
          },
          {
            "@type": "SoftwareApplication",
            "name": "Woney",
            "applicationCategory": "FinanceApplication",
            "operatingSystem": "Web",
            "url": "https://woney.ai/",
            "publisher": { "@id": "https://woney.ai/#organization" },
            "disambiguatingDescription": "In private beta. Not yet generally available; access opens in batches from a waitlist.",
            "description": "Woney creates a card for each purchase, so an AI agent can pay at any online store on its owner's behalf. The agent shops and checks out the way a person would, and nothing changes on the store's side. It never gets the owner's card, and once a payment goes through, the card it used stops working. The owner decides how much it can spend. Woney is in private beta and not yet generally available; access opens in batches from a waitlist.",
            "featureList": [
              "One card per purchase, which stops working once the payment goes through",
              "Each card is created for the exact total of that purchase",
              "Each card only works at the store it was created for",
              "The agent buys on its own under the owner's limit; over it, the purchase waits for approval",
              "A receipt for every purchase, for the agent and for the owner",
              "A record of who asked, what the agent decided, and which card paid",
              "The owner's real card is never given to the agent",
              "An agent reaches Woney through an MCP server or a command-line tool"
            ],
            "audience": {
              "@type": "Audience",
              "audienceType": "People who delegate purchases to an AI assistant, and the developers who build those assistants"
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <!-- The page is prerendered, so without JavaScript a visitor now sees a
         complete landing page whose form quietly does nothing on submit — the
         markup is there, the handler is not. Before prerendering they saw an
         empty div and knew. Turning an obvious failure into a silent one is
         worse than either, so say it plainly instead. -->
    <noscript>
      <div
        style="
          position: fixed;
          inset: 0 0 auto 0;
          z-index: 100;
          background: #f3f0e8;
          color: #070a10;
          padding: 0.875rem 1.25rem;
          font:
            500 0.875rem/1.5 ui-monospace,
            monospace;
          text-align: center;
        "
      >
        This page needs JavaScript to take your email. Enable it, or write to
        <a href="mailto:hello@woney.ai" style="color: inherit"
          >hello@woney.ai</a
        >
        and we will add you by hand.
      </div>
    </noscript>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
