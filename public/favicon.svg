<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Woney">
  <!-- Not the chip mark. That mark is the identity everywhere it has room, but
       at 16px — which is the only size that matters here — its contact
       channels collapse into a gold smudge and the W stops being readable.
       Measured, not assumed: rendered side by side at tab size, the letter
       wins and the mark does not.

       So this keeps the letterform and takes everything else from the family:
       the squircle of the chip, ink-deep for the ground, foil for the stroke.
       The one thing it must do is survive being 16 pixels wide, and a single
       thick stroke does that where five channels cannot. -->
  <rect width="32" height="32" rx="9" fill="#03050a" />
  <path
    d="M7 11 L11.5 22 L16 14.5 L20.5 22 L25 11"
    fill="none"
    stroke="#e5ca98"
    stroke-width="3.4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
