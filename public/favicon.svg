<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Woney">
  <!-- The monogram, which is what the LinkedIn and X profiles carry.

       Not the chip mark, and not by preference. Rendered side by side at tab
       size the chip loses: its contact channels are what draw the letter, and
       below about 24px they close up into a gold smudge with no W left in it.
       The monogram survives because a serif W is one shape, not five gaps.

       Not live text either. A favicon cannot load a webfont — browsers do not
       fetch one for an icon — so the letterform is traced from Instrument
       Serif at 1100px and carried here as a path. It renders identically
       everywhere because there is nothing left to resolve.

       Ink ground, bone letter, foil stop: the same three parts as the avatar,
       in the same arrangement, so a tab and a profile read as one thing. -->
  <rect width="32" height="32" rx="9" fill="#03050a" />
  <g transform="translate(5.300,7.626) scale(0.018824)">
